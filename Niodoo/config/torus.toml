# K-Twisted Torus Configuration
# 
# This defines the topological manifold that serves as the cognitive-affective
# substrate for the NIODOO system. The k-twisted torus is the geometric
# realization of the PAD (Pleasure-Arousal-Dominance) emotional model.

# Major radius (R) - overall size of the torus
# Larger values create a bigger manifold with more separation between states
major_radius = 2.0

# Strip width - maximum range of the v parameter
# Controls how "thick" the torus surface is
strip_width = 0.5

# Number of half-twists (k parameter)
# k=1: non-orientable surface (like a Möbius strip)
# k=2: orientable surface (standard torus with twist)
# Odd k: non-orientable, Even k: orientable
twists = 1

# Random seed for deterministic projection
# Change this to get different but reproducible PAD trajectories
seed = 42

