groups:
- name: niodoo_alerts
  interval: 30s
  rules:
  - alert: HighErrorRate
    expr: rate(niodoo_pipeline_errors_total[5m]) > 0.1
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: "High error rate detected"
      description: "Error rate is {{ $value }} errors/sec for 5 minutes"

  - alert: HighLatency
    expr: histogram_quantile(0.95, sum(rate(niodoo_pipeline_latency_seconds_bucket[5m])) by (le)) > 5.0
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "High latency detected"
      description: "95th percentile latency is {{ $value }}s"

  - alert: CircuitBreakerOpen
    expr: niodoo_circuit_breaker_state == 1
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: "Circuit breaker is open"
      description: "Circuit breaker for {{ $labels.service }} is open"

  - alert: LowCacheHitRate
    expr: rate(niodoo_cache_hits_total[5m]) / rate(niodoo_cache_requests_total[5m]) < 0.5
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: "Low cache hit rate"
      description: "Cache hit rate is {{ $value | humanizePercentage }}"

  - alert: HighMemoryUsage
    expr: niodoo_memory_bytes / niodoo_memory_bytes_limit > 0.9
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "High memory usage"
      description: "Memory usage is {{ $value | humanizePercentage }}"

  - alert: ServiceDown
    expr: up{job="niodoo-pipeline"} == 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "Service is down"
      description: "NIODOO pipeline service is down"

  - alert: QdrantDown
    expr: niodoo_qdrant_health == 0
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: "Qdrant is down"
      description: "Qdrant service is unavailable"

  - alert: vLLMDown
    expr: niodoo_vllm_health == 0
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: "vLLM is down"
      description: "vLLM service is unavailable"

  - alert: TokenPromotionStalled
    expr: rate(niodoo_tokenizer_promotions_total[10m]) == 0
    for: 15m
    labels:
      severity: warning
    annotations:
      summary: "Token promotion stalled"
      description: "No token promotions in the last 15 minutes"
