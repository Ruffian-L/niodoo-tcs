apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-niodoo-dashboard
  namespace: monitoring
data:
  niodoo-dashboard.json: |
    {
      "dashboard": {
        "title": "NIODOO Pipeline Metrics",
        "tags": ["niodoo", "pipeline"],
        "timezone": "browser",
        "panels": [
          {
            "id": 1,
            "title": "Pipeline Latency",
            "type": "graph",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, sum(rate(niodoo_pipeline_latency_seconds_bucket[5m])) by (le))",
                "legendFormat": "95th percentile"
              },
              {
                "expr": "histogram_quantile(0.99, sum(rate(niodoo_pipeline_latency_seconds_bucket[5m])) by (le))",
                "legendFormat": "99th percentile"
              },
              {
                "expr": "histogram_quantile(0.50, sum(rate(niodoo_pipeline_latency_seconds_bucket[5m])) by (le))",
                "legendFormat": "50th percentile"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}
          },
          {
            "id": 2,
            "title": "Request Rate",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(niodoo_pipeline_requests_total[5m])",
                "legendFormat": "Requests/sec"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}
          },
          {
            "id": 3,
            "title": "Error Rate",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(niodoo_pipeline_errors_total[5m])",
                "legendFormat": "Errors/sec"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8}
          },
          {
            "id": 4,
            "title": "Cache Hit Rate",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(niodoo_cache_hits_total[5m]) / rate(niodoo_cache_requests_total[5m])",
                "legendFormat": "Hit Rate"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8}
          },
          {
            "id": 5,
            "title": "Token Promotion Events",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(niodoo_tokenizer_promotions_total[5m])",
                "legendFormat": "Promotions/sec"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16}
          },
          {
            "id": 6,
            "title": "Memory Usage",
            "type": "graph",
            "targets": [
              {
                "expr": "niodoo_memory_bytes",
                "legendFormat": "Memory"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16}
          },
          {
            "id": 7,
            "title": "Circuit Breaker Status",
            "type": "stat",
            "targets": [
              {
                "expr": "niodoo_circuit_breaker_state",
                "legendFormat": "State"
              }
            ],
            "gridPos": {"h": 4, "w": 6, "x": 0, "y": 24}
          },
          {
            "id": 8,
            "title": "Active Connections",
            "type": "stat",
            "targets": [
              {
                "expr": "niodoo_connections_active",
                "legendFormat": "Connections"
              }
            ],
            "gridPos": {"h": 4, "w": 6, "x": 6, "y": 24}
          },
          {
            "id": 9,
            "title": "Qdrant Latency",
            "type": "graph",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, sum(rate(niodoo_qdrant_latency_seconds_bucket[5m])) by (le))",
                "legendFormat": "95th percentile"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 28}
          },
          {
            "id": 10,
            "title": "vLLM Latency",
            "type": "graph",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, sum(rate(niodoo_vllm_latency_seconds_bucket[5m])) by (le))",
                "legendFormat": "95th percentile"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 28}
          }
        ],
        "refresh": "30s",
        "time": {
          "from": "now-1h",
          "to": "now"
        }
      }
    }
