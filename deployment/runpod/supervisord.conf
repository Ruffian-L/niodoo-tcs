[supervisord]
nodaemon=true
logfile=/app/logs/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; ============================================================================
; Qdrant Service (Start First - No Dependencies)
; ============================================================================
[program:qdrant]
command=/usr/local/bin/qdrant --config-path /app/qdrant_config.yaml
directory=/app
autostart=true
autorestart=true
startretries=3
startsecs=5
priority=100
stdout_logfile=/app/logs/qdrant.log
stderr_logfile=/app/logs/qdrant_error.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile_backups=10
environment=QDRANT__SERVICE__HTTP_PORT="6333",QDRANT__SERVICE__GRPC_PORT="6334",QDRANT__STORAGE__STORAGE_PATH="/data/qdrant_storage"

; ============================================================================
; vLLM Service (Start Second - Depends on Qdrant being ready)
; ============================================================================
[program:vllm]
command=/bin/bash -c "echo 'Waiting for Qdrant to be ready...' && /app/health_check.sh qdrant http://localhost:6333/health 30 5 && echo 'Qdrant ready, starting vLLM...' && python3 -m vllm.entrypoints.openai.api_server --model %(ENV_VLLM_MODEL_PATH)s --host %(ENV_VLLM_HOST)s --port %(ENV_VLLM_PORT)s --dtype bfloat16 --gpu-memory-utilization 0.85 --max-model-len 32768 --max-num-batched-tokens 8192 --max-num-seqs 64 --trust-remote-code --api-key-file /run/secrets/vllm_api_key"
directory=/app
autostart=true
autorestart=true
startretries=3
startsecs=60
priority=200
stdout_logfile=/app/logs/vllm.log
stderr_logfile=/app/logs/vllm_error.log
stdout_logfile_maxbytes=100MB
stderr_logfile_maxbytes=100MB
stdout_logfile_backups=10
stderr_logfile_backups=10
environment=CUDA_VISIBLE_DEVICES="0"

; ============================================================================
; NIODOO Rust Service (Start Last - Depends on vLLM and Qdrant being ready)
; ============================================================================
[program:niodoo_service]
command=/bin/bash -c "echo 'Waiting for vLLM and Qdrant to be ready...' && /app/health_check.sh vllm http://localhost:5001/v1/models 120 5 && /app/health_check.sh qdrant http://localhost:6333/health 30 5 && echo 'All services ready, starting NIODOO service...' && /usr/local/bin/niodoo_service --features svc"
directory=/app
autostart=true
autorestart=true
startretries=3
startsecs=10
priority=300
stdout_logfile=/app/logs/niodoo_service.log
stderr_logfile=/app/logs/niodoo_service_error.log
stdout_logfile_maxbytes=100MB
stderr_logfile_maxbytes=100MB
stdout_logfile_backups=10
stderr_logfile_backups=10
environment=VLLM_ENDPOINT="http://localhost:5001",QDRANT_URL="http://localhost:6333",CURATOR_VLLM_ENDPOINT="http://localhost:5001",RUST_LOG="info",NIODOO_RUNPOD_MODE="true"





