model:
  base_model: mistralai/Mistral-7B-Instruct-v0.3
  load_in_4bit: true
  compute_dtype: bfloat16
  quant_type: nf4
  trust_remote_code: false

lora:
  r: 128
  alpha: 256
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

data:
  train_file: ./data/train.jsonl
  eval_file: null
  eval_split_ratio: 0.1
  max_seq_length: 4096
  prompt_template: "[INST] {instruction}\n{input}\n{topology} [/INST]"
  feature_prefix: "[TOPOLOGY]"
  num_workers: 4

optimizer:
  learning_rate: 0.0002
  weight_decay: 0.01
  warmup_ratio: 0.03
  num_train_epochs: 3.0
  gradient_accumulation_steps: 8
  max_grad_norm: 1.0

runtime:
  output_dir: ./outputs
  logging_steps: 10
  evaluation_strategy: steps
  eval_steps: 100
  save_steps: 200
  seed: 42
  bf16: true

topology:
  lambda_weight: 0.05
  lambda_teacher: 0.0
  lambda_sinkhorn: 0.05
  projection: mean
  teacher_cache: ./data/processed/topology_features.jsonl
  teacher_match_field: source_path
  sinkhorn_p: 1.0
  sinkhorn_blur: 0.05
  sinkhorn_scaling: 0.8
  max_sinkhorn_points: 128



