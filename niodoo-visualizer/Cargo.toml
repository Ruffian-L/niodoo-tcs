[package]
name = "niodoo-visualizer"
version = "0.1.0"
edition = "2021"
authors = ["Niodoo Torque Team <torque@niodoo.ai>"]
description = "Real-time 3D visualization of NIODOO cognitive state using Bevy"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
tower = "0.4"
tower-http = { version = "0.6", features = ["cors"] }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"

[[bin]]
name = "niodoo-visualizer"
path = "src/main.rs"

