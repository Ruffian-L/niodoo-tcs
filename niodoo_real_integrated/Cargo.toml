[package]
name = "niodoo_real_integrated"
version = "0.1.0"
edition = "2021"
authors = ["Niodoo Torque Team <torque@niodoo.ai>"]
description = "Full NIODOO pipeline integration with real Qwen embeddings, ERAG memory, tokenizer promotion, vLLM hybrid generation, and learning loop."
license = "MIT"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["beelink"]
niodoo-core = []
knot = ["dep:tcs-knot"]
onnx = []
beelink = []
5080-q = []
gauntlet = []
examples = []
embedded-qdrant = []
pyo3 = ["dep:pyo3", "dep:pyo3-async-runtimes"]
otel = ["dep:opentelemetry", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry"]
svc = ["dep:axum", "dep:tower", "dep:tower-http", "dep:tonic"]
edge = []
gpu = ["candle-core/cuda", "candle-nn/cuda"]
pipeline-v2 = []

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
reqwest = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
prometheus = "0.13"
rand = { workspace = true, features = ["std", "serde"] }
rand_distr = { workspace = true }
tokio = { workspace = true }
nalgebra = { workspace = true }
csv = "1.3"
thiserror = "1.0"
tcs-ml = { path = "../tcs-ml", features = ["onnx"] }
tcs-core = { path = "../tcs-core" }
tcs-tda = { path = "../tcs-tda" }
tcs-knot = { path = "../tcs-knot", optional = true }
tcs-tqft = { path = "../tcs-tqft" }
# niodoo-core = { path = "../niodoo-core" }  # Not available, commented out
tcs-rce = { path = "../tcs-rce" }
candle-core = { workspace = true }
candle-nn = { workspace = true }
once_cell = { workspace = true }
futures = { workspace = true }
uuid = { workspace = true }
plotters = { version = "0.3", default-features = false, features = ["bitmap_backend", "svg_backend"] }
ratatui = "0.27"
crossterm = "0.28"

qdrant-client = { version = "1.15", features = [] }
urlencoding = "2.1"
parking_lot = { workspace = true }
ndarray = { workspace = true }
dashmap = { workspace = true }
blake3 = { workspace = true }
base64 = "0.22"
regex = "1.11"
bincode = "1.3"
hex = "0.4"
lazy_static = "1.5"
async-trait = { workspace = true }
safetensors = { workspace = true }
rayon = { workspace = true }
lru = { workspace = true }
num-complex = { workspace = true }
petgraph = { workspace = true }
ahash = "0.8"
bytemuck = { version = "1.14", default-features = false }
lz4_flex = { version = "0.11", features = ["std"] }
pyo3 = { version = "0.22", features = ["auto-initialize"], optional = true }
pyo3-async-runtimes = { version = "0.22", optional = true }
half = "2.4"
tempfile = "3.10"
tree-sitter = "0.22"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-typescript = "0.23"
linfa = "0.8"  # Kalman filter for PAD state smoothing

# Optional dependencies for features
opentelemetry = { version = "0.24", optional = true, features = ["trace"] }
opentelemetry-otlp = { version = "0.17", optional = true, features = ["tonic", "tls"] }
tracing-opentelemetry = { version = "0.26", optional = true }
axum = { workspace = true, optional = true }
tower = { version = "0.4", optional = true }
tower-http = { version = "0.6", optional = true }
tonic = { version = "0.12", optional = true }
prost = { workspace = true }
prost-types = { workspace = true }
tokio-stream = "0.1"

[build-dependencies]
tonic-build = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }

[dev-dependencies]
serde_json = "1.0"
reqwest = { workspace = true }
tokio = { workspace = true }
criterion = "0.5"
tempfile = "3.10"

[[bench]]
name = "niodoo_real_bench"
harness = false

# Temporarily disabled problematic binaries
# [[bin]]
# name = "soak_prompts_v2"
# path = "src/bin/soak_prompts_v2.rs"

[[bin]]
name = "niodoo_real_integrated"
path = "src/main.rs"

[[bin]]
name = "soak_test"
path = "src/bin/soak_test.rs"

[[bin]]
name = "metrics_runner"
path = "src/bin/metrics_runner.rs"

[[bin]]
name = "ablation_runner"
path = "src/bin/ablation_runner.rs"

[[bin]]
name = "ab_test_runner"
path = "src/bin/ab_test_runner.rs"

[[bin]]
name = "validation_runner"
path = "src/bin/validation_runner.rs"

[[bin]]
name = "test_e2e_pipeline"
path = "src/bin/test_e2e_pipeline.rs"

[[bin]]
name = "test_pipeline_integration"
path = "src/bin/test_pipeline_integration.rs"

[[bin]]
name = "test_full_e2e_pipeline"
path = "src/bin/test_full_e2e_pipeline.rs"

[[bin]]
name = "test_5000_coding_prompts"
path = "src/bin/test_5000_coding_prompts.rs"
